<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>そろばんれんしゅう - たしざん・ひきざん</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Yusei+Magic&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <span class="logo-icon">🧮</span>
                <h1 class="app-title">そろばんれんしゅう</h1>
            </div>
            <div class="header-right">
                <button id="sound-toggle" class="icon-btn" title="おとのON/OFF" aria-label="おとの切り替え">
                    <span id="sound-icon">🔊</span>
                </button>
            </div>
        </header>

        <!-- Stats & Level selector -->
        <div class="control-panel">
            <div class="level-selector">
                <span class="label">けた数:</span>
                <button class="level-btn" data-digits="2">1〜2けた</button>
                <button class="level-btn" data-digits="3">3〜4けた</button>
                <button class="level-btn active" data-digits="5">5けたまで</button>
            </div>
            <div class="stats-bar">
                <div class="stat-item stars">
                    <span class="stat-icon">⭐</span>
                    <span class="stat-label">ほし:</span>
                    <span id="star-count">0</span>
                </div>
                <div class="stat-item streak">
                    <span class="stat-icon">🔥</span>
                    <span class="stat-label">れんぞく:</span>
                    <span id="streak-count">0</span>
                </div>
            </div>
        </div>

        <main class="main-content">
            <!-- Question Card -->
            <div class="question-card">
                <div class="question-badge">もんだい</div>
                <div id="question" class="question-text">12,345 + 67,890 = ?</div>
            </div>
            
            <!-- Soroban Wrapper -->
            <div class="soroban-wrapper">
                <!-- Place value labels -->
                <div class="place-values">
                    <div class="pv-item">万</div>
                    <div class="pv-item">千</div>
                    <div class="pv-item">百</div>
                    <div class="pv-item">十</div>
                    <div class="pv-item">一</div>
                </div>

                <!-- Soroban Frame -->
                <div id="soroban" class="soroban-board">
                    <!-- Rods generated by JS -->
                </div>
                
                <!-- Current Soroban Value Display -->
                <div class="soroban-value-display">
                    そろばんのかず: <span id="current-soroban-val">0</span>
                </div>
            </div>

            <!-- Result Feedback & Countdown Area -->
            <div id="result-area" class="result-area hidden">
                <div id="result-badge" class="result-badge">せいかい！🎉</div>
                <div id="result-detail" class="result-detail"></div>
                <div id="countdown-bar-container" class="countdown-bar-container">
                    <div id="countdown-bar" class="countdown-bar"></div>
                </div>
                <div id="countdown-text" class="countdown-text">3秒ごにつぎのもんだいにいくよ！</div>
            </div>

            <!-- Button Area -->
            <div class="button-area">
                <button id="check-button" class="btn btn-check">できた！</button>
                <button id="clear-button" class="btn btn-clear">リセット 🔄</button>
                <button id="new-question-button" class="btn btn-next">つぎへ ➔</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
