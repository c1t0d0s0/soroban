<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>そろばんれんしゅう - たしざん・ひきざん</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Yusei+Magic&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <span class="logo-icon">🧮</span>
                <h1 class="app-title">そろばんれんしゅう</h1>
            </div>
            <div class="header-right">
                <button id="guide-btn" class="pill-btn guide-btn" title="そろばんのつかいかた" aria-label="そろばんのつかいかた">
                    <span class="btn-icon">📖</span>
                    <span class="btn-text">つかいかた</span>
                </button>
                <button id="history-btn" class="pill-btn history-btn" title="がくしゅうきろく" aria-label="がくしゅうきろく">
                    <span class="btn-icon">📊</span>
                    <span class="btn-text">きろく</span>
                </button>
                <button id="sound-toggle" class="icon-btn" title="おとのON/OFF" aria-label="おとの切り替え">
                    <span id="sound-icon">🔊</span>
                </button>
            </div>
        </header>

        <!-- Stats & Level selector -->
        <div class="control-panel">
            <div class="level-selector">
                <span class="label">けた数:</span>
                <button class="level-btn active" data-digits="2">1〜2けた</button>
                <button class="level-btn" data-digits="3">3〜4けた</button>
                <button class="level-btn" data-digits="5">5けたまで</button>
            </div>
            <div class="stats-bar">
                <div class="stat-item stars">
                    <span class="stat-icon">⭐</span>
                    <span class="stat-label">ほし:</span>
                    <span id="star-count">0</span>
                </div>
                <div class="stat-item streak">
                    <span class="stat-icon">🔥</span>
                    <span class="stat-label">れんぞく:</span>
                    <span id="streak-count">0</span>
                </div>
            </div>
        </div>

        <main class="main-content">
            <!-- Question Card -->
            <div class="question-card">
                <div class="question-badge">もんだい</div>
                <div id="question" class="question-text">25 + 14 = ?</div>
            </div>
            
            <!-- Soroban Wrapper -->
            <div class="soroban-wrapper">
                <!-- Place value labels -->
                <div class="place-values">
                    <div class="pv-item">万</div>
                    <div class="pv-item">千</div>
                    <div class="pv-item">百</div>
                    <div class="pv-item">十</div>
                    <div class="pv-item">一</div>
                </div>

                <!-- Soroban Frame -->
                <div id="soroban" class="soroban-board">
                    <!-- Rods generated by JS -->
                </div>
                
                <!-- Current Soroban Value Display -->
                <div class="soroban-value-display">
                    そろばんのかず: <span id="current-soroban-val">0</span>
                </div>
            </div>

            <!-- Result Feedback & Countdown Area -->
            <div id="result-area" class="result-area hidden">
                <div id="result-badge" class="result-badge">せいかい！🎉</div>
                <div id="result-detail" class="result-detail"></div>
                <div id="countdown-bar-container" class="countdown-bar-container">
                    <div id="countdown-bar" class="countdown-bar"></div>
                </div>
                <div id="countdown-text" class="countdown-text">3秒ごにつぎのもんだいにいくよ！</div>
            </div>

            <!-- Button Area -->
            <div class="button-area">
                <button id="check-button" class="btn btn-check">できた！</button>
                <button id="clear-button" class="btn btn-clear">リセット 🔄</button>
                <button id="new-question-button" class="btn btn-next" disabled>つぎへ ➔</button>
            </div>
        </main>
    </div>

    <!-- Tutorial Guide Modal -->
    <div id="tutorial-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="tutorial-modal-title">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-card">
            <!-- Modal Header -->
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <span class="modal-header-icon">📖</span>
                    <h2 id="tutorial-modal-title" class="modal-title">そろばんのつかいかた</h2>
                </div>
                <button id="tutorial-close-btn" class="icon-btn close-btn" title="とじる" aria-label="ガイドをとじる">✖</button>
            </div>

            <!-- Step Progress Indicator -->
            <div class="tutorial-progress">
                <div class="step-dots" id="tutorial-step-dots"></div>
                <div class="step-counter" id="tutorial-step-counter">1 / 4</div>
            </div>

            <!-- Modal Body Content -->
            <div class="modal-body" id="tutorial-body">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Modal Footer Controls -->
            <div class="modal-footer">
                <button id="tutorial-prev-btn" class="btn btn-clear">◀ まえへ</button>
                <div class="footer-spacer"></div>
                <button id="tutorial-next-btn" class="btn btn-next">つぎへ ▶</button>
                <button id="tutorial-finish-btn" class="btn btn-check hidden">れんしゅうへ！ ➔</button>
            </div>
        </div>
    </div>

    <!-- Learning History Modal -->
    <div id="history-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="history-modal-title">
        <div class="modal-backdrop" id="history-modal-backdrop"></div>
        <div class="modal-card history-modal-card">
            <!-- Modal Header -->
            <div class="modal-header history-header">
                <div class="modal-title-wrap">
                    <span class="modal-header-icon">📊</span>
                    <h2 id="history-modal-title" class="modal-title">がくしゅうきろく</h2>
                </div>
                <button id="history-close-btn" class="icon-btn close-btn" title="とじる" aria-label="きろくをとじる">✖</button>
            </div>

            <!-- Modal Body Content -->
            <div class="modal-body history-body" id="history-body">
                <!-- Summary Stats Grid -->
                <div class="history-summary-grid">
                    <div class="summary-card total-card">
                        <div class="summary-icon">📝</div>
                        <div class="summary-val" id="hist-total-count">0</div>
                        <div class="summary-label">といたもんだい</div>
                    </div>
                    <div class="summary-card accuracy-card">
                        <div class="summary-icon">🎯</div>
                        <div class="summary-val" id="hist-accuracy-rate">0%</div>
                        <div class="summary-label">せいかいりつ</div>
                    </div>
                    <div class="summary-card streak-card">
                        <div class="summary-icon">🔥</div>
                        <div class="summary-val" id="hist-max-streak">0</div>
                        <div class="summary-label">さいこうれんぞく</div>
                    </div>
                    <div class="summary-card speed-card">
                        <div class="summary-icon">⚡</div>
                        <div class="summary-val" id="hist-avg-speed">-</div>
                        <div class="summary-label">へいきん秒</div>
                    </div>
                </div>

                <!-- Level Performance Breakdown -->
                <div class="history-section">
                    <h3 class="history-section-title">けた数べつのせいせき</h3>
                    <div class="level-stats-list" id="level-stats-list">
                        <!-- Injected via JS -->
                    </div>
                </div>

                <!-- Recent Answers Log -->
                <div class="history-section">
                    <h3 class="history-section-title">さいきんのチャレンジ</h3>
                    <div class="history-logs-container" id="history-logs-container">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button id="history-reset-btn" class="btn btn-clear btn-danger-subtle">きろくを消去 🗑️</button>
                <div class="footer-spacer"></div>
                <button id="history-done-btn" class="btn btn-next">とじる</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
